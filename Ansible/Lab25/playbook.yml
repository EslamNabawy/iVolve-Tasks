---
# Lab 25 — one playbook that installs Docker, kubectl and Jenkins on every
# managed node, then reads back a version from each one.
#
# Two of the three installs need a download that this network serves slowly:
# kubectl (59 MB) and the Jenkins package (53 MB). Both are fetched ONCE on the
# control node and copied out, because
#   * two parallel downloads from the managed nodes timed out, and
#   * apt's own fetch from the Jenkins mirror it is assigned never completed.
# The download tasks use `creates:`, so a second run does not re-download and
# the whole playbook stays idempotent.
- name: Install Docker, kubectl and Jenkins
  hosts: managed
  become: true
  gather_facts: true

  vars:
    kubectl_version: v1.37.1
    kubectl_url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
    kubectl_local: "/tmp/kubectl-{{ kubectl_version }}"

    jenkins_version: 2.580.2
    jenkins_key_url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    jenkins_key_local: /tmp/jenkins-keyring.asc
    jenkins_deb_url: "https://get.jenkins.io/debian-stable/jenkins_{{ jenkins_version }}_all.deb"
    jenkins_deb_local: "/tmp/jenkins_{{ jenkins_version }}_all.deb"

  tasks:
    # ---- Docker -----------------------------------------------------------
    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Read the Docker version
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    # ---- kubectl ----------------------------------------------------------
    - name: Download kubectl on the control node
      ansible.builtin.command:
        cmd: >-
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors
          -o {{ kubectl_local }} {{ kubectl_url }}
        creates: "{{ kubectl_local }}"
      delegate_to: localhost
      become: false
      run_once: true

    # The checksum is fetched from the release itself rather than typed into
    # this playbook: a hash in a file proves nothing after the next patch.
    - name: Download the published checksum
      ansible.builtin.uri:
        url: "{{ kubectl_url }}.sha256"
        return_content: true
        timeout: 60
      delegate_to: localhost
      become: false
      run_once: true
      register: kubectl_published_sha

    - name: Verify the downloaded binary against it
      ansible.builtin.command:
        cmd: sha256sum {{ kubectl_local }}
      delegate_to: localhost
      become: false
      run_once: true
      register: kubectl_local_sha
      changed_when: false
      failed_when: >-
        kubectl_local_sha.stdout.split()[0] != kubectl_published_sha.content.split()[0]

    - name: Copy kubectl to the managed nodes
      ansible.builtin.copy:
        src: "{{ kubectl_local }}"
        dest: /usr/local/bin/kubectl
        mode: "0755"

    - name: Read the kubectl version
      ansible.builtin.command: kubectl version --client
      register: kubectl_version_output
      changed_when: false

    # ---- Jenkins ----------------------------------------------------------
    - name: Download the Jenkins signing key on the control node
      ansible.builtin.command:
        cmd: >-
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors
          -o {{ jenkins_key_local }} {{ jenkins_key_url }}
        creates: "{{ jenkins_key_local }}"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Install the signing key on the managed nodes
      ansible.builtin.copy:
        src: "{{ jenkins_key_local }}"
        dest: /usr/share/keyrings/jenkins-keyring.asc
        mode: "0644"

    - name: Add the Jenkins repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present
        update_cache: true

    - name: Download the Jenkins package on the control node
      ansible.builtin.command:
        cmd: >-
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors
          -o {{ jenkins_deb_local }} {{ jenkins_deb_url }}
        creates: "{{ jenkins_deb_local }}"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Copy the package to the managed nodes
      ansible.builtin.copy:
        src: "{{ jenkins_deb_local }}"
        dest: "{{ jenkins_deb_local }}"
        mode: "0644"

    - name: Install Jenkins from the package
      ansible.builtin.apt:
        deb: "{{ jenkins_deb_local }}"

    - name: Read the Jenkins version
      ansible.builtin.shell: dpkg-query -W -f='${Version}\n' jenkins
      register: jenkins_pkg_version
      changed_when: false

    # ---- proof ------------------------------------------------------------
    - name: Verification summary
      ansible.builtin.debug:
        msg:
          - "docker  : {{ docker_version.stdout }}"
          - "kubectl : sha256 {{ kubectl_local_sha.stdout.split()[0] }} (matches the published checksum)"
          - "kubectl : {{ kubectl_version_output.stdout_lines | join(' ') }}"
          - "jenkins : {{ jenkins_pkg_version.stdout }}"
