apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoapp
  namespace: lab23
  labels:
    app: demoapp
    managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demoapp
  template:
    metadata:
      labels:
        app: demoapp
    spec:
      containers:
        - name: demoapp
          # Starts as the image Lab 21 already pushed, so the first Argo CD
          # sync is Healthy. The pipeline rewrites this line and Argo CD
          # follows it.
          image: 172.18.0.1:5000/eslamnabawy/demoapp:1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
