# Lab 10 — the same pod, plus a toleration for workload=ivolveApp:NoSchedule.
# Now the scheduler may place it on the tainted, labelled node.
apiVersion: v1
kind: Pod
metadata:
  name: taint-demo-allowed
spec:
  nodeSelector:
    project: ivolve
  tolerations:
    - key: workload
      operator: Equal
      value: ivolveApp
      effect: NoSchedule
  containers:
    - name: demo
      image: busybox:1.36
      command: ["sleep", "3600"]
