# Lab 10 — this pod asks for the isolated node (nodeSelector project=ivolve)
# but carries no toleration for that node's taint. The scheduler must leave
# it Pending: the label attracts it, the taint keeps it out.
apiVersion: v1
kind: Pod
metadata:
  name: taint-demo-blocked
spec:
  nodeSelector:
    project: ivolve
  containers:
    - name: demo
      image: busybox:1.36
      command: ["sleep", "3600"]
