# Lab 12 — sensitive MySQL credentials, base64 as the deck asks.
#
# These are THROWAWAY lab values on a local kind cluster, committed on purpose
# so the lab is reproducible. base64 is encoding, not encryption: anyone with
# the file can decode it. Never commit a real credential like this.
apiVersion: v1
kind: Secret
metadata:
  name: ivolvesecret
  namespace: ivolve
type: Opaque
data:
  # echo -n 'ivolveroot' | base64
  MYSQL_ROOT_PASSWORD: aXZvbHZlcm9vdA==
  # echo -n 'ivolvepass' | base64
  DB_PASSWORD: aXZvbHZlcGFzcw==
