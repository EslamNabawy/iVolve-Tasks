# Lab 19 — bind that Role to the ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ivolvdeployrolebinding
  namespace: ivolve
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ivolvdeployrole
subjects:
  - kind: ServiceAccount
    name: jenkinssa
    namespace: ivolve
