# Lab 9 — the CNI proof: two pods pinned to different worker nodes.
# If Calico is routing correctly, each pod can ping the other's overlay IP
# even though they are on different nodes.
apiVersion: v1
kind: Pod
metadata:
  name: nettest-worker
  labels:
    app: nettest
spec:
  nodeName: ivolve-worker
  containers:
    - name: nettest
      image: busybox:1.36
      command: ["sleep", "3600"]
